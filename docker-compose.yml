# vaultwarden deployment for Portainer (nj106 fork).
# - bridge network mode (no dedicated project network)
# - host port 8083 -> container 80
# - volume name pinned to vaultwarden_data via `name:` (no compose project prefix)
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    labels:
      - com.centurylinklabs.watchtower.enable=true
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - vaultwarden-data:/data
    environment:
      ROCKET_PORT: "80"

volumes:
  vaultwarden-data:
    driver: local
    name: vaultwarden_data
